[build]
  publish = "_site"
  command = "npm run build:all"

[build.environment]
  NODE_VERSION = "20"

# Security headers + clean URLs
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # HSTS will be set by Netlify automatically if forced SSL

# Redirects — fix previous broken catch-all 404
# Real 404 handling
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

# Clean URLs — optional: /about/ serves /about/index.html
# Netlify handles this automatically with pretty URLs

# Forms — Netlify Forms will auto-detect forms with data-netlify="true"
# No extra config needed, but we can add honeypot

# Sitemap
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

# GA4 — no header needed
